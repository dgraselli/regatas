name: Preview de PR

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

# Un solo preview a la vez POR PR; cancela los viejos en curso de ese mismo PR.
concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 20
          cache: npm

      - run: npm ci
        if: github.event.action != 'closed'

      - name: Build con el basePath del preview
        if: github.event.action != 'closed'
        run: npm run build
        env:
          # Mocks: cada preview muestra los mismos escenarios determinísticos
          # (incluida la sudestada con lluvia), sin depender de APIs externas.
          NEXT_PUBLIC_USE_MOCKS: 'true'
          NEXT_PUBLIC_BASE_PATH: /pr-preview/pr-${{ github.event.number }}

      - run: touch out/.nojekyll
        if: github.event.action != 'closed'

      - name: Estampar el SHA en el service worker
        if: github.event.action != 'closed'
        run: sed -i "s/__BUILD_MARKER__/${{ github.sha }}/" out/sw.js

      - name: Publicar / limpiar el preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./out
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          # Sin esquema: la acción antepone "https://" sola (con el esquema
          # duplicaba la URL en el comentario del PR: "https://https://...").
          custom-url: regatas.com.ar
